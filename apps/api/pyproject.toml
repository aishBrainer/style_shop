[project]
name = "ai-fashion-studio-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live Postgres (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:PIL.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F401"]   # models are imported for metadata registration
"tests/*.py" = ["S101"]        # asserts are the point

[tool.ruff.lint.isort]
known-first-party = ["app"]
